post:
  tags:
    - Auth
  summary: Send password reset email
  operationId: sendPasswordResetEmail
  description: Sends a password reset email to the user.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth-reset-email.yaml'
  responses:
    '200':
      description: Email sent successfully
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Email sent successfully
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '../../components/responses/400.yaml'
