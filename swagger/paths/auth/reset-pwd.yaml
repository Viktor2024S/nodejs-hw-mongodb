post:
  tags:
    - Auth
  summary: Reset password
  operationId: resetPassword
  description: Resets the user's password using a reset token.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth-reset-pwd.yaml'
  responses:
    '200':
      description: Password successfully reset!
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Password successfully reset!
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/responses/401.yaml'
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '../../components/responses/400.yaml'
