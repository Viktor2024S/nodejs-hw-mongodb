post:
  tags:
    - Auth
  summary: Register a new user
  operationId: registerUser
  description: Registers a new user with name, email, and password.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth-register.yaml'
  responses:
    '201':
      description: User registration successful
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: User registration successful
              data:
                $ref: '../../components/schemas/userInfo.yaml'
    '409':
      description: Email in use
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 409
              message:
                type: string
                example: Email in use
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: Bad Request
