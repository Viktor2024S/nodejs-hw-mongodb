post:
  tags:
    - Auth
  summary: Log in to the application
  operationId: loginUser
  description: Logs in a user with email and password and returns tokens.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth-login.yaml'
  responses:
    '200':
      description: Log in successful!
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Log in successful!
              data:
                type: object
                properties:
                  tokens:
                    $ref: '../../components/schemas/tokens-response.yaml'
                  user:
                    $ref: '../../components/schemas/userInfo.yaml'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/responses/401.yaml'
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '../../components/responses/400.yaml'
