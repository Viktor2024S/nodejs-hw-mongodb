tags:
  - Contacts
summary: Create contact
operationId: createContacts
description: Create a contact with payload
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            description: Contact's name
            type: string
            example: John Doe
          phoneNumber:
            description: Contact's phone number
            type: string
            example: '+380200000000'
          email:
            description: Contact's email
            type: string
            example: jon.doe@mail.com
          isFavourite:
            description: Is the contact a favorite?
            type: boolean
            example: true
          contactType:
            description: Contact's type
            type: string
            enum: [work, home, personal]
            example: work
          photo:
            description: Contact's photo file
            type: string
            format: binary
responses:
  '201':
    $ref: '../../components/responses/201.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '422':
    $ref: '../../components/responses/422.yaml'
