tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get list of contacts with this endpoint'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: name
      description: All contact's fields can be mentioned. Default value - _id
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      example: asc
  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
      example: work
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: false
responses:
  '200':
    $ref: '../../components/responses/200.yaml'
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          properties:
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
            message:
              type: string
              example: Successfully found contacts!
  '401':
    $ref: '../../components/responses/401.yaml'
