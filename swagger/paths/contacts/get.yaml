tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieves a list of all contacts from the database with support for pagination, sorting and filtering.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
    description: Page number to retrieve (default is 1).
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
    description: Number of items per page (default is 10).
  - in: query
    name: sortBy
    schema:
      type: string
      enum:
        - name
        - phoneNumber
        - email
        - contactType
        - isFavourite
    description: Field to sort by.
  - in: query
    name: sortOrder
    schema:
      type: string
      enum:
        - asc
        - desc
    description: Sort order (asc for ascending, desc for descending).
  - in: query
    name: filter
    style: deepObject
    schema:
      type: object
      properties:
        isFavourite:
          type: boolean
        contactType:
          type: string
          enum:
            - work
            - home
            - personal
responses:
  '200':
    description: Successfully retrieved contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                perPage:
                  type: integer
                totalItems:
                  type: integer
                totalPages:
                  type: integer
                hasPreviousPage:
                  type: boolean
                hasNextPage:
                  type: boolean
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
