tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update an existing contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John Doe
          phoneNumber:
            type: string
            example: '+380200000000'
          email:
            type: string
            example: jon.doe@mail.com
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          photo:
            type: string
            format: binary
responses:
  '200':
    $ref: '../../../components/responses/200.yaml'
    description: Successfully patched a contact
    content:
      application/json:
        schema:
          properties:
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../../../../components/schemas/contact.yaml'
  '422':
    $ref: '../../../components/responses/422.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
