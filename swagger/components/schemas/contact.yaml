type: object
properties:
  _id:
    type: string
    example: 65ca67e7ae7f10c88b598384
  name:
    type: string
    example: Jane Doe
  phoneNumber:
    type: string
    example: '+380200000000'
  email:
    type: string
    example: jane.doe@mail.com
  isFavourite:
    type: boolean
    example: true
  contactType:
    type: string
    enum:
      - work
      - home
      - personal
    example: work
  ownerId:
    type: string
    example: 65ca67e7ae7f10c88b598385
  photo:
    type: string
    example: https://res.cloudinary.com/.../contacts/photo/
  createdAt:
    type: string
    example: '2024-05-23T10:00:00.000Z'
  updatedAt:
    type: string
    example: '2024-05-23T10:00:00.000Z'
