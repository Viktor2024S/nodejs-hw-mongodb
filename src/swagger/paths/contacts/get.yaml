tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieves a list of all contacts. Supports pagination.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: The page number to retrieve.
    required: false
    schema:
      type: integer
      default: 1
  - name: perPage
    in: query
    description: The number of contacts per page.
    required: false
    schema:
      type: integer
      default: 10
  - name: sortBy
    in: query
    description: Field to sort by (default: _id)
    required: false
    schema:
      type: string
      example: 'name'
  - name: sortOrder
    in: query
    description: Sort order (asc/desc)
    required: false
    schema:
      type: string
      enum: ['asc', 'desc']
      default: 'asc'
  - name: contactType
    in: query
    description: Filter by contact type
    required: false
    schema:
      type: string
      enum: ['work', 'home', 'personal']
  - name: isFavourite
    in: query
    description: Filter by favourite (true/false)
    required: false
    schema:
      type: boolean
responses:
  '200':
    description: A list of contacts was successfully retrieved.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Contact'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 5
                totalPages:
                  type: integer
                  example: 1
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    description: Unauthorized.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  '500':
    description: Internal server error.