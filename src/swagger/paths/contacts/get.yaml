get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getContacts
  description: Retrieves a list of all contacts. Supports pagination.
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      description: The page number to retrieve.
      required: false
      schema:
        type: integer
        default: 1
    - name: limit
      in: query
      description: The number of contacts per page.
      required: false
      schema:
        type: integer
        default: 20
  responses:
    '200':
      description: A list of contacts was successfully retrieved.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../components/schemas/Contact.yaml'
    '401':
      description: Unauthorized.
    '500':
      description: Internal server error.
