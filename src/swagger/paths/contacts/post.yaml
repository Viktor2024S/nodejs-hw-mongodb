post:
  tags:
    - Contacts
  summary: Create a new contact
  operationId: createContact
  description: Creates a new contact in the database.
  security:
    - bearerAuth: []
  requestBody:
    description: The contact data to create.
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - phone
          properties:
            name:
              type: string
              example: 'Jane Smith'
            email:
              type: string
              example: 'jane.smith@example.com'
            phone:
              type: string
              example: '+380951234567'
  responses:
    '201':
      description: Contact was successfully created.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Contact.yaml'
    '400':
      description: Bad request.
    '401':
      description: Unauthorized.
