tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Creates a new contact in the database.
security:
  - bearerAuth: []
requestBody:
  description: The contact data to create.
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - contactType
        properties:
          name:
            type: string
            example: 'Jane Smith'
          phoneNumber:
            type: string
            example: '+380951234567'
          email:
            type: string
            example: 'jane.smith@example.com'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            type: string
            example: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
responses:
  '201':
    description: Contact was successfully created.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              $ref: '#/components/schemas/Contact'
  '400':
    description: Bad request.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  '401':
    description: Unauthorized.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
