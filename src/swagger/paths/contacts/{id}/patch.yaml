tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Updates a contact by ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    description: The ID of the contact to update.
    required: true
    schema:
      type: string
requestBody:
  description: The contact data to update (optional fields).
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Updated Name'
          phoneNumber:
            type: string
            example: '+380509876543'
          email:
            type: string
            example: 'updated@example.com'
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            example: 'work'
          photo:
            type: string
            example: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
responses:
  '200':
    description: Contact was successfully updated.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully updated contact!'
            data:
              $ref: '#/components/schemas/Contact'
  '400':
    description: Bad request.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  '401':
    description: Unauthorized.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  '404':
    description: Contact not found.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
