patch:
  tags:
    - Contacts
  summary: Update a contact
  operationId: updateContact
  description: Updates a contact by ID.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      description: The ID of the contact to update.
      required: true
      schema:
        type: string
  requestBody:
    description: The contact data to update.
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: 'Updated Name'
            email:
              type: string
              example: 'updated.email@example.com'
            phone:
              type: string
              example: '+380509876543'
  responses:
    '200':
      description: Contact was successfully updated.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Contact.yaml'
    '400':
      description: Bad request.
    '401':
      description: Unauthorized.
    '404':
      description: Contact not found.
