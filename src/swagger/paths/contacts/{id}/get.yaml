get:
  tags:
    - Contacts
  summary: Get a contact by ID
  operationId: getContactById
  description: Returns a single contact by its unique ID.
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      description: The ID of the contact to retrieve.
      required: true
      schema:
        type: string
  responses:
    '200':
      description: A single contact object was successfully retrieved.
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully found contact!'
              data:
                $ref: '#/components/schemas/Contact'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: The requested contact was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
