tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: Deletes a contact by ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    description: The ID of the contact to delete.
    required: true
    schema:
      type: string
responses:
  '200':
    description: Contact was successfully deleted.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully deleted contact!'
            data:
              $ref: '#/components/schemas/Contact'
  '401':
    description: Unauthorized.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  '404':
    description: Contact not found.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
